name: Deploy

# Two release paths, one pipeline, gated by the trigger:
#
#   manual run, ref = main    → deploy STAGING (tinytales-api-staging, Neon staging branch)
#   manual run, ref = v* tag  → deploy PROD    (tinytales-api,         Neon main branch)
#
# Manual only (workflow_dispatch) — no push/tag auto-fires this anymore. Pick the
# branch or tag from the "Run workflow" ref dropdown in the Actions tab; the
# deploy jobs below key off that selected ref, same as before.
#
# Both paths run the same `check` job (lint + typecheck + tests) first, then a
# target-specific deploy job. The deploy jobs are mutually exclusive: each guards
# on the trigger, so a main run never touches prod and a tag run never touches
# staging.

on:
  workflow_dispatch:

jobs:
  # Shared gate — the same checks CI runs, so both staging and prod deploys are
  # blocked on a green suite regardless of which trigger fired.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

  # ── STAGING ────────────────────────────────────────────────────────────────
  # Fires on a manual run with ref = main. Builds the image, migrates the Neon *staging*
  # branch, and deploys the tinytales-api-staging Cloud Run service. Auth reuses the
  # tinytalesforus-prod Firebase project (staging validates against the same tokens);
  # only the database differs.
  deploy-staging:
    needs: check
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for Workload Identity Federation
    env:
      IMAGE: asia-southeast1-docker.pkg.dev/tinytalesforus-prod/tinytales/tinytales-api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF, no key files)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/597924238682/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: tinytales-api-deploy@tinytalesforus-prod.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image to Artifact Registry
        run: |
          gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Run database migrations (Neon staging, direct endpoint)
        run: |
          DATABASE_URL_DIRECT="$(gcloud secrets versions access latest --secret tinytales-api-database-url-direct-staging --project tinytalesforus-prod)"
          echo "::add-mask::$DATABASE_URL_DIRECT"
          export DATABASE_URL_DIRECT
          npm run db:migrate


      - name: Deploy to Cloud Run (staging)
        run: |
          gcloud run deploy tinytales-api-staging \
            --image "$IMAGE" \
            --project tinytalesforus-prod \
            --region asia-southeast1 \
            --service-account tinytales-api-run@tinytalesforus-prod.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --set-secrets DATABASE_URL=tinytales-api-database-url-staging:latest,WHATSAPP_ACCESS_TOKEN=tinytales-api-whatsapp-access-token:latest,OPENAI_API_KEY=tinytales-api-openai-api-key:latest,IMAGE_INTAKE_UPLOAD_TOKEN=tinytales-api-image-intake-upload-token:latest,RAZORPAY_KEY_ID=tinytales-api-razorpay-key-id-test:latest,RAZORPAY_KEY_SECRET=tinytales-api-razorpay-key-secret-test:latest,RAZORPAY_WEBHOOK_SECRET=tinytales-api-razorpay-webhook-secret-test:latest \
            --set-env-vars "^#^FIREBASE_PROJECT_ID=tinytalesforus-prod#APP_ENV=staging#CORS_ALLOWED_ORIGINS=http://localhost:3000,https://tinytalesforus.com,https://www.tinytalesforus.com,https://staging.tinytalesforus.com#SCHEDULER_OIDC_AUDIENCE=tinytales-api-sweeps-staging#SCHEDULER_SERVICE_ACCOUNTS=tinytales-scheduler@tinytalesforus-prod.iam.gserviceaccount.com#TASKS_QUEUE=tinytales-sweeps-staging#TASKS_PROJECT=tinytalesforus-prod#TASKS_LOCATION=asia-southeast1#TASKS_TARGET_BASE_URL=https://tinytales-api-staging-597924238682.asia-southeast1.run.app#TASKS_SERVICE_ACCOUNT=tinytales-scheduler@tinytalesforus-prod.iam.gserviceaccount.com#WHATSAPP_PHONE_NUMBER_ID=927479007124972#WHATSAPP_TEMPLATE_ORDER_PAID=tinytales_order_paid_ops#WHATSAPP_TEMPLATE_LOCALE=en" \
            --min-instances 0 \
            --cpu-boost \
            --port 8080
            # PROXY_SHARED_SECRET: append to --set-secrets above once that
            # secret exists (see comment block above this step).
            # --set-secrets ...,PROXY_SHARED_SECRET=tinytales-api-proxy-shared-secret:latest

  # ── PRODUCTION ───────────────────────────────────────────────────────────────
  # Fires on a manual run with ref = a v* tag. Identical build, but migrates the
  # Neon *main* branch and deploys the prod tinytales-api service with min-instances
  # 1 (one instance kept warm to avoid cold starts). Cutting a release is still
  # `git tag vX.Y.Z && git push --tags`, then trigger this workflow manually
  # with that tag selected as the ref.
  deploy-prod:
    needs: check
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for Workload Identity Federation
    env:
      IMAGE: asia-southeast1-docker.pkg.dev/tinytalesforus-prod/tinytales/tinytales-api:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF, no key files)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/597924238682/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: tinytales-api-deploy@tinytalesforus-prod.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image to Artifact Registry
        run: |
          gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Run database migrations (Neon main, direct endpoint)
        run: |
          DATABASE_URL_DIRECT="$(gcloud secrets versions access latest --secret tinytales-api-database-url-direct --project tinytalesforus-prod)"
          echo "::add-mask::$DATABASE_URL_DIRECT"
          export DATABASE_URL_DIRECT
          npm run db:migrate

      # Same custom-delimiter rationale as the staging job above: `#` instead
      # of the default comma (no comma-separated values here today, but kept
      # consistent with staging) and instead of `@` (ALERT_EMAIL_FROM /
      # ALERT_EMAIL_TO are email addresses and would collide with `@` as a
      # delimiter).
      #

      - name: Deploy to Cloud Run (prod)
        run: |
          gcloud run deploy tinytales-api \
            --image "$IMAGE" \
            --project tinytalesforus-prod \
            --region asia-southeast1 \
            --service-account tinytales-api-run@tinytalesforus-prod.iam.gserviceaccount.com \
            --allow-unauthenticated \
            --set-secrets DATABASE_URL=tinytales-api-database-url:latest,WHATSAPP_ACCESS_TOKEN=tinytales-api-whatsapp-access-token:latest,OPENAI_API_KEY=tinytales-api-openai-api-key:latest,IMAGE_INTAKE_UPLOAD_TOKEN=tinytales-api-image-intake-upload-token:latest,RAZORPAY_KEY_ID=tinytales-api-razorpay-key-id-live:latest,RAZORPAY_KEY_SECRET=tinytales-api-razorpay-key-secret-live:latest,RAZORPAY_WEBHOOK_SECRET=tinytales-api-razorpay-webhook-secret-live:latest \
            --set-env-vars "^#^FIREBASE_PROJECT_ID=tinytalesforus-prod#APP_ENV=production#CORS_ALLOWED_ORIGINS=https://tinytalesforus.com,https://www.tinytalesforus.com#SCHEDULER_OIDC_AUDIENCE=tinytales-api-sweeps#SCHEDULER_SERVICE_ACCOUNTS=tinytales-scheduler@tinytalesforus-prod.iam.gserviceaccount.com#TASKS_QUEUE=tinytales-sweeps#TASKS_PROJECT=tinytalesforus-prod#TASKS_LOCATION=asia-southeast1#TASKS_TARGET_BASE_URL=https://tinytales-api-597924238682.asia-southeast1.run.app#TASKS_SERVICE_ACCOUNT=tinytales-scheduler@tinytalesforus-prod.iam.gserviceaccount.com#WHATSAPP_PHONE_NUMBER_ID=927479007124972#WHATSAPP_TEMPLATE_ORDER_PAID=tinytales_order_paid_ops#WHATSAPP_TEMPLATE_LOCALE=en" \
            --min-instances 1 \
            --cpu-boost \
            --port 8080
            # PROXY_SHARED_SECRET: append to --set-secrets above once that
            # secret exists (see comment block above this step).
            # --set-secrets ...,PROXY_SHARED_SECRET=tinytales-api-proxy-shared-secret:latest
